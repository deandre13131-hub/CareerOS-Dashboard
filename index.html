<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerOS — Decision Engine</title>
<style>
  :root{--ink:#16221F;--paper:#F7F8F6;--ledger:#1B5E4A;--amber:#A66B1F;--signal:#9E3B2F;--rule:#D8DDD9;--muted:#6B7672;--card:#FFFFFF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  .serif{font-family:Georgia,"Times New Roman",serif}.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:14px}
  h1{font-size:26px;letter-spacing:-.01em}.strip{display:flex;gap:14px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}.strip .ev{color:var(--amber)}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin:38px 0 12px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--rule)}.job{border-left:4px solid var(--ledger);padding:20px}.job.rejected{border-left-color:var(--signal)}
  .jobtop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}.jobtitle{font-size:19px;line-height:1.3}.jobmeta{color:var(--muted);font-size:13.5px;margin-top:2px}
  .nums{display:flex;gap:26px;text-align:right}.num{font-size:26px;font-variant-numeric:tabular-nums}.numlabel{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
  .rec{margin-top:12px;font-weight:600;color:var(--ledger)}.rec.bad{color:var(--signal)}.rec .sub{font-weight:400;color:var(--muted)}
  .fail{color:var(--signal);margin-top:8px;font-size:14px}
  ol.actions{margin:12px 0 0;padding:0;list-style:none}ol.actions li{display:flex;gap:8px;font-size:14px;margin-top:4px}ol.actions .n{color:var(--muted)}
  details{margin-top:14px}summary{cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--ledger);list-style:none}summary::-webkit-details-marker{display:none}summary:hover{text-decoration:underline;text-underline-offset:4px}
  .comp{padding:10px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:0 16px;align-items:baseline}
  .compname{font-size:14px}.chip{display:inline-block;border:1px solid;border-radius:2px;padding:1px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-left:8px;vertical-align:1px}
  .chip.low{color:var(--amber);border-color:var(--amber)}.chip.ok{color:var(--ledger);border-color:var(--ledger)}
  .bar{height:3px;background:var(--rule);max-width:220px;margin-top:5px}.bar>div{height:100%;background:var(--ledger)}
  .evtext{color:var(--muted);font-size:12.5px;margin-top:5px}.compscore{font-size:16px;font-variant-numeric:tabular-nums}
  .companynote{color:var(--amber);font-size:12.5px;padding:10px 0;border-top:1px solid var(--rule)}
  .grid2{display:grid;gap:24px;grid-template-columns:1fr}@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
  .kv{display:flex;justify-content:space-between;gap:16px;margin-top:8px;font-size:14px}.kv dt{color:var(--muted)}.kv dd .learn{color:var(--amber)}
  .pad{padding:20px}ul.resumes{list-style:none}ul.resumes li{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--rule);font-size:14px}ul.resumes li:last-child{border-bottom:none}ul.resumes .ind{color:var(--muted);font-size:12px;text-align:right}
  .valnum{font-size:26px;font-variant-numeric:tabular-nums}.vallist{margin-top:8px;color:var(--muted);font-size:12px;list-style:none}
  footer{margin-top:40px;border-top:1px solid var(--rule);padding-top:14px;color:var(--muted);font-size:12.5px}
  .empty{padding:20px;color:var(--muted);font-size:14px}
  .applylink{color:var(--ledger);text-decoration:none;border:1px solid var(--ledger);border-radius:2px;padding:1px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-left:10px;white-space:nowrap}.applylink:hover{background:var(--ledger);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 class="serif">CareerOS</h1>
    <div class="strip mono"><span>Decision engine</span><span id="ver"></span><span class="ev" id="ev"></span></div>
  </header>
  <div id="root"></div>
  <footer>Interview probability is evidence-weighted (empirical). Career score is priority-weighted from career_profile.yaml. Amber marks judgment-grade evidence.<br>Static export · 2 analyzed opportunities</footer>
</div>
<script>
const D={"engine": {"version": "0.1.0", "evidence_status": "expert_heuristic"}, "profile": {"name": "Dre Smart", "current_employer": "Brown Advisory", "minimum_salary": 75000, "target_salary_min": 80000, "target_salary_max": 95000, "preferred_locations": ["Washington DC", "Baltimore", "Charlotte", "Raleigh", "Richmond", "McLean", "Norfolk", "Chicago", "New York"], "priorities": {"compensation": 10, "career_growth": 10, "exit_opportunities": 9, "learning": 9, "prestige": 8, "location": 7, "remote_flexibility": 6, "travel": 4}, "proficient_skills": ["Excel", "Financial Statement Analysis", "Audit", "Investment Operations", "Capital Calls", "NAV Calculations", "Investor Reporting", "PowerPoint", "GAAP", "Financial Modeling", "Financial Reporting", "Variance Analysis"], "learning_skills": ["SQL", "Python"]}, "resumes": [{"id": "financial_analyst", "label": "Financial Analyst", "industries": ["Financial Services", "Corporate Finance", "Banking"]}, {"id": "investment_analyst", "label": "Investment Analyst", "industries": ["Asset Management", "Financial Services"]}, {"id": "commercial_real_estate", "label": "Commercial Real Estate Analyst", "industries": ["Commercial Real Estate"]}, {"id": "corporate_accountant", "label": "Corporate Accountant", "industries": ["Accounting", "Financial Services"]}], "jobs": [{"file": "002_capital_one_sr_associate_financial_analysis.json", "title": "Sr. Associate, Financial Analysis (Card Tech Finance)", "company": "Capital One", "location": "McLean", "salary_min": 96500, "salary_max": 110100, "career_score": 97.3, "interview_probability": 100.0, "recommendation": "Apply Immediately", "confidence": 92.43333333333334, "recommended_resume": "Financial Analyst", "missing_skills": [], "next_actions": ["Use the 'Financial Analyst' resume.", "Apply now via https://www.capitalonecareers.com/job/mclean/sr-associate-financial-analysis/1732/93687684608.", "If you know anyone at Capital One, reach out before submitting."], "hard_filter_failures": [], "components": [{"name": "Skill Match", "score": 100.0, "weight": 0.4, "evidence": ["Matches required skills: excel, financial modeling, financial reporting, variance analysis."], "evidence_id": "weight.skill_match", "confidence_label": "Medium"}, {"name": "Experience Fit", "score": 100.0, "weight": 0.25, "evidence": ["1 years of experience fits the 'junior' band (0-2)."], "evidence_id": "weight.experience_fit", "confidence_label": "Medium"}, {"name": "Compensation Alignment", "score": 100.0, "weight": 0.2, "evidence": ["Job's top of range ($110,100) meets or exceeds your target ($80,000)."], "evidence_id": "weight.compensation_alignment", "confidence_label": "Medium"}, {"name": "Location Fit", "score": 100.0, "weight": 0.15, "evidence": ["McLean matches your preferred locations."], "evidence_id": "weight.location_fit", "confidence_label": "Medium"}, {"name": "Career Growth", "score": 91.0, "weight": 0.15, "evidence": ["Capital One rated 9.1/10 for career growth (low confidence).", "Large analyst development programs; strong internal mobility reputation in finance."], "evidence_id": "weight.career_growth", "confidence_label": "Low"}, {"name": "Prestige", "score": 87.0, "weight": 0.1, "evidence": ["Capital One rated 8.7/10 for prestige (low confidence).", "Top-10 US bank by assets; well-regarded FP&A and analytics organization."], "evidence_id": "weight.prestige", "confidence_label": "Low"}, {"name": "Exit Opportunities", "score": 90.0, "weight": 0.12, "evidence": ["Capital One rated 9.0/10 for exit opportunities (low confidence).", "Alumni commonly move to fintech, PE-backed operators, and corporate development roles."], "evidence_id": "weight.exit_opportunities", "confidence_label": "Low"}], "company_profile_on_file": true, "apply_url": "https://www.capitalonecareers.com/job/mclean/sr-associate-financial-analysis/1732/93687684608", "status": "pending"}, {"file": "001_t_rowe_price_associate_analyst.json", "title": "Associate Analyst, US Small-Cap Growth Equity (New Horizons Fund)", "company": "T. Rowe Price", "location": "Baltimore", "salary_min": 110000, "salary_max": 140000, "career_score": 78.5, "interview_probability": 70.0, "recommendation": "Apply \u2014 Address Gaps First", "confidence": 74.625, "recommended_resume": "Financial Analyst", "missing_skills": ["ai tool building", "equity research"], "next_actions": ["Use the 'Financial Analyst' resume.", "Close the gap before or while applying: ai tool building, equity research.", "Apply this week; mention the gap skills as areas of active learning.", "If you know anyone at T. Rowe Price, reach out before submitting."], "hard_filter_failures": [], "components": [{"name": "Skill Match", "score": 50.0, "weight": 0.4, "evidence": ["Matches required skills: excel, financial modeling.", "Missing required skills: ai tool building, equity research."], "evidence_id": "weight.skill_match", "confidence_label": "Medium"}, {"name": "Experience Fit", "score": 100.0, "weight": 0.25, "evidence": ["1 years of experience fits the 'junior' band (0-2)."], "evidence_id": "weight.experience_fit", "confidence_label": "Medium"}, {"name": "Compensation Alignment", "score": 100.0, "weight": 0.2, "evidence": ["Job's top of range ($140,000) meets or exceeds your target ($80,000)."], "evidence_id": "weight.compensation_alignment", "confidence_label": "Medium"}, {"name": "Location Fit", "score": 100.0, "weight": 0.15, "evidence": ["Baltimore matches your preferred locations."], "evidence_id": "weight.location_fit", "confidence_label": "Medium"}, {"name": "Career Growth", "score": 75.0, "weight": 0.15, "evidence": ["T. Rowe Price rated 7.5/10 for career growth (medium confidence).", "3-5yr structured Associate Analyst program with explicit promotion path to Investment Analyst, active mentoring, and firm-supported CFA progression (troweprice.com/careers/career-pathways; Wall Street Oasis \"T Rowe Price Associate Analyst Program\" forum consensus). Tempered by Glassdoor's employee-reported \"career opportunities\" sub-score of 3.4/5 \u2014 notably lower than the firm's compensation (3.9/5) and work-life balance (3.8/5) sub-scores \u2014 plus Morningstar's 2026 note of \"an uptick in investment professional departures.\" Two independent source types corroborate the structured-program claim (company career-pathways page + WSO forum), hence Medium rather than Low, but the Glassdoor/Morningstar signals argue against scoring higher than Capital One's 9.1."], "evidence_id": "weight.career_growth", "confidence_label": "Medium"}, {"name": "Prestige", "score": 83.0, "weight": 0.1, "evidence": ["T. Rowe Price rated 8.3/10 for prestige (medium confidence).", "Ranked #3 asset management brand in Peregrine Communications' Global 100 report, displacing BlackRock (Institutional Investor, 2021 \u2014 dated, flagged as such). $1.89T AUM as of May 2026. Fiduciary, client-focused reputation. Set against this: Morningstar downgraded T. Rowe Price's Parent rating from High to Above Average in 2026, citing a performance slump and rising investment-professional turnover \u2014 a live, recent negative signal that keeps this below a pure brand-ranking score. Two independent sources (Institutional Investor/Peregrine brand ranking; Morningstar Parent rating + AUM reporting) support Medium confidence."], "evidence_id": "weight.prestige", "confidence_label": "Medium"}, {"name": "Exit Opportunities", "score": 75.0, "weight": 0.12, "evidence": ["T. Rowe Price rated 7.5/10 for exit opportunities (low confidence).", "Wall Street Oasis forum consensus: placement \"on par with other top asset management firms,\" strong into equity hedge funds, meritocratic (some analysts promoted without an MBA). This is the weakest-sourced dimension \u2014 it rests on one source type (crowd-sourced forum commentary), not independently verified alumni placement data. A direct LinkedIn alumni-outcomes search (candidates who list \"T. Rowe Price analyst\" and where they moved next) was attempted per the research brief but isn't reliably extractable through available tools without authenticated scraping, which this charter doesn't permit. Confidence stays Low until a second, independent source corroborates the WSO read."], "evidence_id": "weight.exit_opportunities", "confidence_label": "Low"}], "company_profile_on_file": true, "apply_url": null, "status": "pending"}], "tracker": {"applied": 0, "declined": 0, "pending": 2}, "validation": {"entry_count": 2, "entries": ["001_t_rowe_price_associate_analyst.md", "002_capital_one_sr_associate_financial_analysis.md"]}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>n==null?"—":"$"+n.toLocaleString();
document.getElementById("ver").textContent="v"+D.engine.version;
document.getElementById("ev").textContent="evidence: "+D.engine.evidence_status;
function chip(l){const low=/^(low|unrated)$/i.test(l);return`<span class="chip mono ${low?"low":"ok"}">${esc(l)}</span>`}
function comp(c){return`<div class="comp"><div><span class="compname">${esc(c.name)}</span>${chip(c.confidence_label)}<div class="bar"><div style="width:${Math.min(100,c.weight*250)}px"></div></div><div class="evtext">${esc(c.evidence.join(" "))}</div></div><span class="compscore mono">${c.score.toFixed(1)}</span></div>`}
function statusTag(s){if(s==="applied")return` <span class="chip ok">Applied</span>`;if(s==="declined")return` <span class="chip low">Declined</span>`;return""}
function jobCard(j){const bad=j.hard_filter_failures.length>0;const apply=j.apply_url?` <a href="${esc(j.apply_url)}" target="_blank" rel="noopener" class="applylink mono">Apply →</a>`:"";return`<article class="card"><div class="job ${bad?"rejected":""}"><div class="jobtop"><div><div class="jobtitle serif">${esc(j.title)}${statusTag(j.status)}</div><div class="jobmeta">${esc(j.company)} · ${esc(j.location)} · ${money(j.salary_min)}–${money(j.salary_max)}</div></div><div class="nums"><div><div class="num mono">${j.career_score.toFixed(1)}</div><div class="numlabel">Career score</div></div><div><div class="num mono">${j.interview_probability.toFixed(0)}%</div><div class="numlabel">Interview prob.</div></div></div></div><div class="rec ${bad?"bad":""}">${esc(j.recommendation)}${j.recommended_resume?` <span class="sub">· resume: ${esc(j.recommended_resume)}</span>`:""}${apply}</div>${j.hard_filter_failures.map(f=>`<div class="fail">✗ ${esc(f)}</div>`).join("")}<ol class="actions">${j.next_actions.map((a,i)=>`<li><span class="n mono">${i+1}.</span><span>${esc(a)}</span></li>`).join("")}</ol><details><summary class="mono">Show evidence</summary>${j.components.map(comp).join("")}${j.company_profile_on_file?"":` <div class="companynote">No company profile on file for ${esc(j.company)}.</div>`}</details></div></article>`}
const P=D.profile,T=D.tracker||{applied:0,declined:0,pending:0};
const pipeline=D.jobs.filter(j=>j.status!=="declined"),declined=D.jobs.filter(j=>j.status==="declined");
const trackerStrip=`<div class="card pad" style="display:flex;gap:32px"><div><span class="valnum mono">${T.applied}</span> <span style="color:var(--muted)">applied</span></div><div><span class="valnum mono">${T.declined}</span> <span style="color:var(--muted)">declined</span></div><div><span class="valnum mono">${T.pending}</span> <span style="color:var(--muted)">in pipeline</span></div></div>`;
const declinedSection=declined.length?`<h2 class="mono">Declined · kept for later · ${declined.length}</h2>${declined.map(jobCard).join("")}`:"";
document.getElementById("root").innerHTML=`<h2 class="mono">Pipeline</h2>${trackerStrip}<h2 class="mono">Opportunities · ${pipeline.length}</h2>${pipeline.length?pipeline.map(jobCard).join(""):`<div class="card empty">No active opportunities. Declined ones are kept below.</div>`}${declinedSection}<div class="grid2"><div><h2 class="mono">Career profile</h2><div class="card pad"><div class="serif" style="font-size:16px">${esc(P.name)}${P.current_employer?" · "+esc(P.current_employer):""}</div><dl><div class="kv"><dt>Salary floor</dt><dd class="mono">${money(P.minimum_salary)}</dd></div><div class="kv"><dt>Target range</dt><dd class="mono">${money(P.target_salary_min)}–${money(P.target_salary_max)}</dd></div><div class="kv"><dt>Locations</dt><dd>${esc(P.preferred_locations.slice(0,4).join(", "))}${P.preferred_locations.length>4?"…":""}</dd></div><div class="kv"><dt>Learning</dt><dd><span class="learn">${esc(P.learning_skills.join(", "))||"—"}</span></dd></div></dl></div></div><div><h2 class="mono">Resume library</h2><ul class="resumes card">${D.resumes.map(r=>`<li><span>${esc(r.label)}</span><span class="ind">${esc(r.industries.join(" · "))}</span></li>`).join("")}</ul></div></div><h2 class="mono">Validation ledger</h2><div class="card pad"><span class="valnum mono">${D.validation.entry_count}</span> <span style="color:var(--muted)">validation ${D.validation.entry_count===1?"entry":"entries"} on record</span>${D.validation.entries.length?`<ul class="vallist mono">${D.validation.entries.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:`<p style="color:var(--muted);margin-top:8px">The model is unvalidated against reality.</p>`}</div>`;
</script>
</body>
</html>
