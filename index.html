analytical skill with a concrete project, engage every interviewer with thoughtful questions, listen actively, and send personalized thank-you notes referencing specifics. (Source: <a href=\"https://www.interviewquery.com/interview-guides/choice-hotels-business-analyst\">Interview Query guide<\/a>)<\/li>\n<\/ul>\n<p><strong>Practical implication for you:<\/strong> the behavioral portion is very winnable with your real stories. The differentiator will be the technical/case portion. Do not let that be the round where you go quiet. Prepare to reason out loud.<\/p>\n<hr>\n<h2>4. Likely questions with tailored answers<\/h2>\n<blockquote>\n<p>Ground rule for every answer: use only real experience. Brown Advisory (Investment Operations Analyst, June 2026 to present), RSM US LLP (Audit &amp; Assurance Intern, summer 2025), Elon University B.S. Finance and DI basketball captain, CareerOS, and the MLB XGBoost model. Never invent employers, metrics, deals, or DCF/real-estate work you have not done.<\/p>\n<\/blockquote>\n<h3>A. Behavioral (STAR), grounded only in real background<\/h3>\n<p><strong>Q1. Tell me about yourself / walk me through your background.<\/strong>\n\"I'm a finance graduate from Elon, where I was also the captain of our Division I basketball team, which is where I learned to lead under pressure and hold a group to a standard. Professionally, I started in audit at RSM, doing substantive testing and building Excel workpapers for variance analysis and reconciliations under GAAP and tight deadlines, so I learned to be rigorous with other people's numbers. I'm now an Investment Operations Analyst at Brown Advisory, where I handle capital calls, distributions, and NAV calculations in Addepar for alternative asset portfolios, plus investor reporting and data-integrity work for institutional and high-net-worth clients. On my own time I build things: I built CareerOS, a Python and FastAPI application with its own scoring engine and CI/CD, and an MLB analytics model in Python using XGBoost that forecasts player performance from Statcast data with simulation. So I'm someone who is careful with data during the day and teaches himself to build models at night. This role is exactly where those two habits meet.\"<\/p>\n<p><strong>Q2. Describe a time you used data to drive a decision or catch a problem. (their stated favorite)<\/strong>\n- <strong>S:<\/strong> At Brown Advisory, my work involves NAV calculations and investor reporting for alternative asset portfolios, where a single bad data point flows straight into what a client sees.\n- <strong>T:<\/strong> I'm responsible for data-integrity checks and reconciliations, and for resolving reporting and API issues with the tech teams.\n- <strong>A:<\/strong> When numbers didn't tie out, I traced them back through the data mapping rather than patching the output, reconciled the source records, and worked directly with the technology team to fix the underlying reporting or API issue so it wouldn't recur.\n- <strong>R:<\/strong> The reporting held up to institutional-client scrutiny, and fixing the root cause meant the same break didn't come back the next cycle. (Keep this honest and qualitative; do not attach invented percentages.)<\/p>\n<p><strong>Q3. Tell me about a challenging project and how you pushed through.<\/strong>\nUse CareerOS or the MLB model. \"I built an MLB model in Python with XGBoost to forecast player performance from Statcast data. The hard part wasn't the idea, it was the plumbing: cleaning messy Statcast data, choosing features, validating that the model wasn't just memorizing, and adding a simulation layer so the output was a distribution, not a single guess. I'm not a computer science major, so I had to learn a lot of it as I went, largely by breaking it and fixing it. I use Claude Code daily to move faster, but I own the logic. I got it to the point where it produced forecasts I could actually reason about and defend.\" Then bridge: \"That's the same muscle this role needs. Take messy inputs, build a defensible model, and be able to explain the answer.\"<\/p>\n<p><strong>Q4. Tell me about working on a team / with a difficult teammate.<\/strong>\nLean on being a DI basketball captain. \"As captain, I had teammates I didn't always agree with. I learned that you get more by listening first and addressing the person privately than by calling them out. My job was to keep everyone pointed at the same standard, even the people who resisted feedback. I carry that into work: I'd rather understand why someone sees the numbers differently than assume I'm right.\" This maps directly to their value \"Listen.\"<\/p>\n<p><strong>Q5. How do you handle multiple priorities and deadlines?<\/strong>\nUse RSM plus Brown Advisory. \"In audit at RSM, everything runs against a hard close, so I learned to triage by impact and to flag risks early rather than surprise anyone at the deadline. At Brown Advisory the reporting cycles are recurring and unforgiving, so I plan around the calendar and protect data accuracy first. My rule is: know what's truly due when, communicate early, and never let speed compromise the integrity of the numbers.\" This hits their values \"Be Quick\" and \"Show Integrity\" at once.<\/p>\n<p><strong>Q6. Greatest strength and a weakness / growth area.<\/strong>\nStrength: \"I'm unusually willing to teach myself hard quantitative things and actually ship them, not just talk about them. CareerOS and the MLB model both exist.\" Weakness/growth (be honest and strategic): \"The specific area I most want to build is investment valuation on real assets: DCF, NPV, IRR, and real estate feasibility. I have the modeling foundation and I understand the concepts, but I haven't applied them to hotel deals professionally yet. That's honestly part of why this role is so appealing to me, and I've already started studying the mechanics so I can contribute quickly.\" This preempts the gap and reframes it as motivation.<\/p>\n<h3>B. Technical / valuation questions, with an honest primer and gap-framing<\/h3>\n<p><strong>How to frame the gap (say something like this once, early, and then move on):<\/strong>\n\"I want to be straight with you: I haven't built DCF or hotel feasibility models in a professional setting yet. What I do have is a strong modeling foundation in Excel, real financial-statement and variance work from audit, and a track record of teaching myself technical quantitative work and shipping it. I understand the mechanics of these valuation methods and I'm actively sharpening them, so I'd walk in ready to learn your models fast rather than pretending I've already done this.\"<\/p>\n<p>Then be able to actually explain the following. Interviewers forgive a candid gap far more easily when the candidate clearly gets the concepts.<\/p>\n<p><strong>Primer: DCF (Discounted Cash Flow)<\/strong>\n- The core idea: a dollar next year is worth less than a dollar today, so to value something you <strong>project its future cash flows and discount each one back to today<\/strong> using a discount rate. Add up those present values and you get the value today.\n- Present value of a future cash flow = CashFlow / (1 + r)^n, where r is the discount rate and n is the number of periods out.\n- The <strong>discount rate<\/strong> reflects the riskiness and time value of the money. In corporate settings it's often a weighted average cost of capital (WACC) or a required rate of return. Higher risk means a higher rate, which lowers today's value.\n- A DCF usually has two pieces: the <strong>explicit forecast period<\/strong> (say, the years you model in detail) and a <strong>terminal value<\/strong> for everything after (often a perpetuity growth formula or an exit multiple), which is itself discounted back.\n- One-line version to say out loud: \"A DCF is just projecting future cash flows and pulling them back to today's dollars at a discount rate that reflects risk and the time value of money.\"<\/p>\n<p><strong>Primer: NPV (Net Present Value)<\/strong>\n- NPV = the sum of the present values of all cash flows, <strong>including the upfront cost/investment as a negative at time zero.<\/strong>\n- Decision rule: <strong>NPV greater than 0 means the investment creates value<\/strong> (returns more than your discount rate demands) and is worth doing; NPV less than 0 destroys value.\n- For this role's flavor: if Choice gives a franchisee an incentive today (a cash outflow) to win a contract that produces years of royalty fees (inflows), the NPV of that decision tells you whether the incentive pays for itself in present-value terms.<\/p>\n<p><strong>Primer: IRR (Internal Rate of Return)<\/strong>\n- IRR is <strong>the discount rate that makes NPV exactly zero.<\/strong> It's the annualized return the investment earns on its own.\n- Decision rule: accept if <strong>IRR is above your hurdle rate<\/strong> (the minimum acceptable return); reject if it's below.\n- Know the classic caveats so you sound fluent: IRR can be misleading when cash flows switch signs more than once (multiple IRRs), and it can rank projects differently than NPV when comparing very different sizes or timing. When NPV and IRR disagree, NPV is the tiebreaker because it measures dollars of value created.<\/p>\n<p><strong>Primer: Cash flow waterfall<\/strong>\n- A \"waterfall\" describes <strong>how cash gets distributed in a specific priority order<\/strong> among parties or buckets, one tier filling before the next. In this role it shows up as modeling how a deal's cash and value flow through stages, and it connects to what you already touched at Brown Advisory with capital calls and distributions in alternative assets, where distribution waterfalls are a real thing. You can honestly say you've seen the distribution-waterfall concept on the investor-operations side.<\/p>\n<p><strong>Primer: Hotel / real estate feasibility basics (so you can talk the language)<\/strong>\n- A hotel feasibility study asks: <strong>given this market and this proposed property, what will it realistically earn, and does that support the investment?<\/strong>\n- The three metrics that run the industry:\n  - <strong>ADR (Average Daily Rate):<\/strong> average room-night price.\n  - <strong>Occupancy:<\/strong> percent of available rooms sold.\n  - <strong>RevPAR (Revenue Per Available Room) = ADR x Occupancy<\/strong> (or room revenue divided by available rooms). RevPAR is the single most important top-line hotel metric because it blends price and volume.\n- <strong>Competitive set and penetration indices.<\/strong> Feasibility work benchmarks a hotel against a named \"comp set\" using <strong>STR / CoStar data<\/strong> (formerly Smith Travel Research). The penetration indices tell you fair share versus actual share, where 100 = fair share:\n  - <strong>MPI (Market Penetration Index):<\/strong> occupancy share.\n  - <strong>ARI (Average Rate Index):<\/strong> ADR share.\n  - <strong>RGI (Revenue Generation Index):<\/strong> RevPAR share.\n- <strong>Demand segmentation:<\/strong> transient/corporate, leisure, group/meetings, government, extended stay, etc. You estimate the property's fair share of each source.\n- <strong>Stabilization:<\/strong> hotels ramp; models typically project to a stabilized year (often year 3 to 5) and over a ~10-year horizon.\n- <strong>The Choice-specific twist:<\/strong> because Choice is a franchisor, feasibility here is often less about whether the <em>owner's<\/em> building pencils and more about the value of the <em>franchise contract<\/em> to Choice: projected royalty streams (a percentage of the hotel's room revenue), the cost of any incentive, and the risk the hotel exits the system early. Higher RevPAR and longer retention mean more royalty value.\n- (Feasibility primer sources: <a href=\"https://hladvisors.com/hotel-feasibility-study-methodology/\">Hotel &amp; Leisure Advisors methodology<\/a>, <a href=\"https://www.mmcginvest.com/hotel-feasibility-study\">MMCG hotel feasibility<\/a>, <a href=\"https://tiltanalytics.com/hotel-underwriting-guide/\">TILT Analytics hotel underwriting<\/a>.)<\/p>\n<p><strong>Likely technical prompts and how to handle them:<\/strong>\n- <em>\"Walk me through a DCF / how would you value a stream of franchise fees?\"<\/em> Project the annual royalty cash flows over the contract life, pick a discount rate reflecting risk, discount each year back, sum them, subtract any upfront incentive cost, and that's the NPV of the contract to Choice. Say it in that order and you've shown you get it.\n- <em>\"What's the difference between NPV and IRR, and which do you trust?\"<\/em> Give the definitions above and land on: \"IRR is intuitive as a single percentage, but I trust NPV when they conflict because it measures actual value created and doesn't break on unusual cash flow patterns.\"\n- <em>\"How would you build a model to evaluate whether an incentive to a franchisee is worth it?\"<\/em> Structure it out loud: inputs (projected RevPAR/occupancy/ADR, royalty rate, contract term, retention/exit risk, the incentive amount), the projected royalty cash flows, discount them, compare NPV with and without the incentive, and stress-test the assumptions with sensitivity scenarios. This is genuinely close to how you already think about building models, so let that confidence show.\n- If they push into something you don't know: say so plainly, then reason from first principles. \"I haven't built that specific analysis, but here's how I'd approach it...\" is a strong answer for someone at your level.<\/p>\n<h3>C. \"Why Choice Hotels / why this role\"<\/h3>\n<p><strong>Q. Why Choice Hotels?<\/strong>\n\"Two reasons. First, the business model is genuinely interesting to me. Choice is asset-light: you win by signing the right franchisees, helping their hotels perform, and keeping them in the system, and I like that the finance work is directly tied to that growth engine. 2025 was a record development year and the international and extended-stay momentum shows the model is working. Second, the values line up with how I actually operate. 'Be Curious' is how I ended up teaching myself Python and building models on my own time, and 'Show Integrity' is the whole point of the data-integrity and reconciliation work I do now. And honestly, as someone who bet on himself as a walk-on-mentality athlete and as a self-taught builder, the 'bet on yourself, the striver, the entrepreneur' framing resonates with me.\"<\/p>\n<p><strong>Q. Why this role specifically, given your background?<\/strong>\n\"This role is the intersection of the two things I'm best at and most drawn to: rigorous, data-integrity-first analysis, and building financial models. I've done the careful-with-other-people's-numbers work in audit and in investment operations, and I've built quantitative models from scratch on my own time. The valuation methods this role uses day to day, DCF, NPV, IRR, feasibility, are the area I most want to grow into, and I'd rather build that depth here, on real deals that matter to the company's growth, than anywhere else. I know I'd have to ramp on the hospitality and real-estate specifics, and I'm genuinely excited to do that.\"<\/p>\n<p><strong>Q. You're a bit early in your career and haven't done real estate valuation. Why should we take the risk?<\/strong>\n\"Fair question, and I won't oversell what I haven't done. What I'd point to is evidence, not promises. I taught myself to build a full Python and FastAPI application with CI/CD, and an XGBoost forecasting model with simulation, without being told to and without a CS background. That's the exact profile of someone who ramps fast on a new modeling domain. Pair that with the Excel and financial-statement rigor I already use professionally, and I think I'm a low-risk bet to be productive quickly and a high-upside one over time.\"<\/p>\n<hr>\n<h2>5. Smart questions to ask them<\/h2>\n<p>Pick a few per interviewer; tailor to their role.<\/p>\n<p><strong>About the work:<\/strong>\n1. \"When the team evaluates a franchise deal, how much of the analysis is the value of the contract to Choice versus the underlying hotel's own feasibility? I'd love to understand where the emphasis sits.\"\n2. \"How standardized are the deal-value and DCF models today versus built fresh per deal? Is there appetite for improving the tooling, or is it fairly locked in?\"\n3. \"What does the incentive-decision process look like end to end, from a developer conversation to a modeled recommendation to a yes or no?\"\n4. \"How does the team use STR/CoStar data and penetration indices in the feasibility work here?\"<\/p>\n<p><strong>About growth and the team:<\/strong>\n5. \"For someone strong on modeling fundamentals but newer to hotel real estate specifically, what does a successful first 6 to 12 months look like?\"\n6. \"You mentioned this role has two peer teammates and reports to the Manager. How does work get divided across the three analysts?\"\n7. \"Where do people in this seat tend to go next inside Choice?\"<\/p>\n<p><strong>About strategy (shows you did the reading):<\/strong>\n8. \"2025 was a record development year and international and extended stay are clearly leading. Does that shift where feasibility and incentive dollars get focused in 2026?\"\n9. \"Property exits hit a multi-year low recently. How much of the team's work is about retaining and re-signing existing franchisees versus underwriting brand-new deals?\"<\/p>\n<p><strong>Smart close:<\/strong>\n10. \"Is there anything about my background that gives you hesitation, so I can address it directly?\" (Bold, invites them to surface the gap so you can answer it live.)<\/p>\n<hr>\n<h2>6. One-page prep checklist<\/h2>\n<p><strong>Know cold (company):<\/strong>\n- [ ] Asset-light franchisor model: revenue = royalties + marketing/reservation fees + initial fees; profit scales with signings, hotel revenue, and retention.\n- [ ] Brands by tier (Comfort, Cambria, Ascend, WoodSpring/Everhome extended stay, Sleep, Quality, Clarion).\n- [ ] 2025 headline numbers: ~440 openings (+14%), franchise agreements +22%, ~$1.6B revenue, ~$625.6M adj. EBITDA, international ~160k rooms (+13%), record extended stay, Q1 2026 U.S. openings +32%, exits at 3-year low.\n- [ ] HQ at Pike &amp; Rose, North Bethesda; 4 days onsite hybrid; individual contributor reporting to Manager, Franchise Feasibility &amp; Investments, two peers.\n- [ ] Values: Welcome and Respect Everyone, Be Bold, Be Quick, Listen, Be Curious, Show Integrity. Lead: Act with Intention, Lead with Authenticity, Grow &amp; Deliver.<\/p>\n<p><strong>Know cold (technical):<\/strong>\n- [ ] Explain DCF in one sentence and the PV formula.\n- [ ] NPV definition + decision rule (&gt;0 = create value).\n- [ ] IRR definition (rate where NPV = 0) + hurdle-rate rule + why NPV wins ties.\n- [ ] ADR, Occupancy, RevPAR (= ADR x Occupancy) and why RevPAR matters.\n- [ ] Comp set + STR/CoStar + MPI/ARI/RGI (100 = fair share).\n- [ ] How you'd model whether a franchisee incentive is worth it (inputs, discounted royalty flows, NPV with/without, sensitivities).<\/p>\n<p><strong>Stories ready (STAR, real only):<\/strong>\n- [ ] Brown Advisory data-integrity / reconciliation / API-issue story.\n- [ ] MLB XGBoost model (self-taught, messy data, simulation) or CareerOS build.\n- [ ] RSM audit deadline / variance-analysis workpaper story.\n- [ ] Basketball captain leadership / difficult teammate story.\n- [ ] Honest strength + honest growth area (valuation on real assets).<\/p>\n<p><strong>Logistics and polish:<\/strong>\n- [ ] Reconfirm interview format and rounds with the recruiter.\n- [ ] Confirm you meet the no-sponsorship requirement and are good with 4-day onsite hybrid in North Bethesda.\n- [ ] Have 4 to 6 tailored questions ready per Section 5.\n- [ ] Bring/clean up your resume; be ready to walk any line item.\n- [ ] Prepare to reason out loud on the technical portion; do not go silent.\n- [ ] Send personalized thank-you notes referencing specific things each interviewer said.<\/p>\n<p><strong>The one honest line to have memorized:<\/strong>\n\"I haven't built DCF or hotel feasibility models professionally yet, but I have a strong modeling foundation, I understand the mechanics, and I've proven I teach myself hard quantitative work and ship it. This is the exact area I want to grow, and I'd ramp fast.\"<\/p>\n<hr>\n<h2>7. Skills to brush up before the interview<\/h2>\n<p>Prioritized. Spend the most time on the top three.<\/p>\n<ol>\n<li><strong>DCF.<\/strong> Be able to draw a small one on paper or in Excel: 5 years of cash flows, a discount rate, present values, a simple terminal value, summed to a value today. Do it twice until it's automatic. Watch one solid explainer and rebuild it yourself.<\/li>\n<li><strong>NPV and IRR.<\/strong> Master <code>=NPV()<\/code> and <code>=IRR()<\/code> in Excel and, more importantly, the decision rules and the NPV-vs-IRR tiebreaker logic. Be ready to explain each in one plain sentence to a \"non-finance\" listener (they explicitly value this).<\/li>\n<li><strong>Hotel feasibility basics.<\/strong> ADR, Occupancy, RevPAR and the relationship between them; comp set and STR/CoStar; MPI/ARI/RGI; stabilization and the franchisor's royalty-value angle. You do not need to become an appraiser, just fluent in the vocabulary.<\/li>\n<li><strong>Cash flow waterfall.<\/strong> Understand the priority-of-distribution concept; connect it honestly to the distributions/capital-calls work you already do at Brown Advisory.<\/li>\n<li><strong>Sensitivity / scenario thinking in Excel.<\/strong> Data tables, toggling key assumptions (discount rate, RevPAR, royalty rate, retention). This is where your real Excel strength lets you shine without needing hotel experience.<\/li>\n<li><strong>Light SQL/Tableau familiarity (optional, only \"preferred\").<\/strong> If you have a spare hour, be able to say honestly where you are with SQL (learning, applied via the MLB model) rather than overstating it.<\/li>\n<\/ol>\n<hr>\n<h2>The single most important thing<\/h2>\n<p><strong>Nail the honest gap-framing on DCF/NPV/IRR/feasibility, then prove learnability with your real builds.<\/strong> If you can explain those valuation methods in plain English, tie a franchise-fee example to NPV, and immediately back it with \"here's the MLB model and CareerOS I taught myself and shipped,\" you convert your biggest weakness into your most convincing pitch: a low-risk, high-upside hire who is genuinely hungry to grow into exactly this work. Do not bluff, and do not go quiet in the technical round. Reason out loud, and let your obvious ability to learn carry the day.<\/p>"}], "tracker": {"applied": 0, "declined": 0, "pending": 5}, "validation": {"entry_count": 5, "entries": ["001_t_rowe_price_associate_analyst.md", "002_capital_one_sr_associate_financial_analysis.md", "003_capital_one_senior_financial_analyst.md", "004_stanley_black_decker_sr_financial_analyst.md", "005_choice_hotels_senior_analyst_franchise_feasibility.md"]}};

document.getElementById("ver").textContent="v"+D.engine.version;
document.getElementById("ev").textContent="evidence: "+D.engine.evidence_status;

const STAGES=[["interested","Interested"],["applied","Applied"],["heard_back","Heard Back"],["interview","Interview"],["offer","Offer"],["rejected","Rejected"],["declined","Declined"]];
const LABEL=Object.fromEntries(STAGES);
const KEY="careeros_stage_v1";
function loadStages(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function saveStages(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let STAGE=loadStages();
D.jobs.forEach(j=>{if(!(j.file in STAGE)){STAGE[j.file]=j.status==="applied"?"applied":(j.status==="declined"?"declined":"interested");}});
function stageOf(f){return STAGE[f]||"interested";}
function setStage(f,s){STAGE[f]=s;saveStages(STAGE);render();}
window._setStage=setStage;

function chip(l){const low=/^(low|unrated)$/i.test(l);return`<span class="chip mono ${low?"low":"ok"}">${esc(l)}</span>`}
function comp(c){return`<div class="comp"><div><span class="compname">${esc(c.name)}</span>${chip(c.confidence_label)}<div class="bar"><div style="width:${Math.min(100,c.weight*250)}px"></div></div><div class="evtext">${esc((c.evidence||[]).join(" "))}</div></div><span class="compscore mono">${c.score.toFixed(1)}</span></div>`}

function controls(j){const s=stageOf(j.file);
  const b=(label,to,cls)=>`<button class="sbtn ${cls||''}" onclick="_setStage('${j.file}','${to}')">${label}</button>`;
  let btns=[];
  if(s==="interested")btns=[b("Mark applied","applied","go"),b("Decline","declined","warn")];
  else if(s==="applied")btns=[b("Heard back →","heard_back","go"),b("Rejected","rejected","warn"),b("Back","interested","ghost")];
  else if(s==="heard_back")btns=[b("Got an interview →","interview","go"),b("Rejected","rejected","warn"),b("Back","applied","ghost")];
  else if(s==="interview")btns=[b("Got an offer","offer","go"),b("Rejected","rejected","warn"),b("Back","heard_back","ghost")];
  else if(s==="offer")btns=[b("Back","interview","ghost")];
  else if(s==="rejected")btns=[b("Reopen","interested","ghost")];
  else if(s==="declined")btns=[b("Restore to pipeline","interested","ghost")];
  return `<div class="controls">${btns.join("")}</div>`;
}
function prepBlock(j){const s=stageOf(j.file);
  if(!j.interview_prep_html){return s==="interview"?`<div class="evtext" style="margin-top:12px">No interview-prep dossier on file for this role yet.</div>`:"";}
  return `<details class="prep" ${s==="interview"?"open":""}><summary class="mono">Interview prep from the agent</summary><div class="prepbody">${j.interview_prep_html}</div></details>`;
}
function stageTag(s){if(s==="interested"||s==="applied")return"";return` <span class="stagetag ${s}">${esc(LABEL[s]||s)}</span>`;}

function jobCard(j){const s=stageOf(j.file);const bad=(j.hard_filter_failures||[]).length>0;
  const apply=j.apply_url?` <a href="${esc(j.apply_url)}" target="_blank" rel="noopener" class="applylink mono">Apply →</a>`:"";
  return `<article class="card"><div class="job ${bad?"rejected":""}">`+
    `<div class="jobtop"><div><div class="jobtitle serif">${esc(j.title)}${stageTag(s)}</div>`+
    `<div class="jobmeta">${esc(j.company)} · ${esc(j.location)} · ${money(j.salary_min)}–${money(j.salary_max)}</div></div>`+
    `<div class="nums"><div><div class="num mono">${j.career_score.toFixed(1)}</div><div class="numlabel">Career score</div></div>`+
    `<div><div class="num mono conf conf-${j.interview_confidence.toLowerCase()}">${esc(j.interview_confidence)}</div><div class="numlabel">Interview conf.</div></div></div></div>`+
    `<div class="rationale">${esc(j.rationale)}</div>`+
    `<div class="rec ${bad?"bad":""}">${esc(j.recommendation)}${j.recommended_resume?` <span class="sub">· resume: ${esc(j.recommended_resume)}</span>`:""}${apply}</div>`+
    (j.hard_filter_failures||[]).map(f=>`<div class="fail">✗ ${esc(f)}</div>`).join("")+
    `<ol class="actions">${(j.next_actions||[]).map((a,i)=>`<li><span class="n mono">${i+1}.</span><span>${esc(a)}</span></li>`).join("")}</ol>`+
    controls(j)+prepBlock(j)+
    `<details><summary class="mono">Show evidence</summary>`+
    `<div class="evtext" style="padding:8px 0;border-bottom:1px solid var(--rule)">Interview fit signal ${j.interview_probability.toFixed(1)}/100, banded as <b>${esc(j.interview_confidence)}</b>. Estimated competitiveness: ${esc(j.competitiveness)}. Applicant-pool selectivity is not modeled, so a strong fit is never a guaranteed interview.</div>`+
    (j.components||[]).map(comp).join("")+
    (j.company_profile_on_file?"":`<div class="companynote">No company profile on file for ${esc(j.company)}.</div>`)+
    `</details></div></article>`;
}

function render(){
  const P=D.profile;
  const counts={};STAGES.forEach(([k])=>counts[k]=0);D.jobs.forEach(j=>counts[stageOf(j.file)]++);
  const stagebar=`<div class="stagebar card">`+STAGES.map(([k,l])=>`<div class="cell"><div class="n mono">${counts[k]}</div><div class="l">${esc(l)}</div></div>`).join("")+`</div>`;
  let html=`<h2 class="mono">Your pipeline</h2>${stagebar}`;
  let any=false;
  STAGES.forEach(([k,l])=>{
    const js=D.jobs.filter(j=>stageOf(j.file)===k).sort((a,b)=>b.career_score-a.career_score);
    if(js.length){any=true;html+=`<h2 class="mono">${esc(l)} · ${js.length}</h2>`+js.map(jobCard).join("");}
  });
  if(!any)html+=`<div class="card empty">No opportunities yet.</div>`;
  html+=`<div class="grid2"><div><h2 class="mono">Career profile</h2><div class="card pad"><div class="serif" style="font-size:16px">${esc(P.name)}${P.current_employer?" · "+esc(P.current_employer):""}</div><dl><div class="kv"><dt>Salary floor</dt><dd class="mono">${money(P.minimum_salary)}</dd></div><div class="kv"><dt>Target range</dt><dd class="mono">${money(P.target_salary_min)}–${money(P.target_salary_max)}</dd></div><div class="kv"><dt>Locations</dt><dd>${esc(P.preferred_locations.slice(0,4).join(", "))}${P.preferred_locations.length>4?"…":""}</dd></div><div class="kv"><dt>Learning</dt><dd><span class="learn">${esc(P.learning_skills.join(", "))||"—"}</span></dd></div></dl></div></div><div><h2 class="mono">Resume library</h2><ul class="resumes card">${D.resumes.map(r=>`<li><span>${esc(r.label)}</span><span class="ind">${esc(r.industries.join(" · "))}</span></li>`).join("")}</ul></div></div>`;
  html+=`<h2 class="mono">Validation ledger</h2><div class="card pad"><span class="valnum mono">${D.validation.entry_count}</span> <span style="color:var(--muted)">validation ${D.validation.entry_count===1?"entry":"entries"} on record</span>${D.validation.entries.length?`<ul class="vallist mono">${D.validation.entries.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:`<p style="color:var(--muted);margin-top:8px">The model is unvalidated against reality.</p>`}</div>`;
  document.getElementById("root").innerHTML=html;
}
render();
</script>
</body>
</html>
